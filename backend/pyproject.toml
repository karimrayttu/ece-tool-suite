[project]
name = "ece-suite-backend"
version = "0.1.0"
description = "ECE Tool Suite backend sidecar: instrument control, provenance, assistant bridge"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Karim Mahdi" }]
keywords = ["scpi", "visa", "instrument", "oscilloscope", "electronics", "test-and-measurement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

# Upper bounds on the packages that break things when they move a major version. The exact
# set the test suite was last run against is pinned in runtime-constraints.txt.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "numpy>=1.26,<3",
    "pyvisa>=1.14,<2",
    "pyvisa-py>=0.7,<1",
    "websockets>=12",
    "httpx>=0.27,<1",     # Digi-Key, Nexar, the MCP client and the installer downloader
]

[project.optional-dependencies]
# Real-hardware transport helpers (USB/serial discovery). LAN and raw socket need none of these.
hw = [
    "psutil>=5.9",         # TCPIP subnet discovery
    "pyusb>=1.2",          # USBTMC
    "libusb-package>=1.0", # bundled libusb backend for USBTMC
    "pyserial>=3.5",       # serial instruments
    "zeroconf>=0.130",     # HiSLIP/LXI announcements
]
assistant = [
    "anthropic>=0.40",
    "claude-agent-sdk>=0.1.0",
    "mcp>=1.23",           # imported directly by mcp_server.py, not just via the SDK
]
mcu = [
    "pymcuprog>=3.17",     # AVR/PIC flash programming and firmware read (UPDI/debuggers)
    "intelhex>=2.3",       # hex parsing for the firmware readback
]
# LabVIEW automation goes through COM, which only exists on Windows.
labview = [
    "pywin32>=306; sys_platform == 'win32'",
]
power = [
    "control>=0.10",         # closed-loop margin and Bode verification of the compensator
    # 1.7.0 takes an access violation inside the native core on the inductor-advise path
    # (tests/test_magnetics.py::test_advise_inductor_returns_real_designs_with_losses kills
    # the interpreter). Held at 1.6.x until that is fixed upstream.
    "pyopenmagnetics>=1.6,<1.7",
]
# spicelib is GPL-3.0. It is kept out of `power` so that installing the extras does not
# quietly impose copyleft on a build you redistribute. See THIRD-PARTY-NOTICES.md.
spice = [
    "spicelib>=1.3",         # LTspice/ngspice .raw parsing for power-stage verification
]
rtl = [
    "cocotb>=2.0",           # optional Python testbenches in the RTL tab
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ece_suite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]
ignore = [
    # Lines run to 100 as a convention, not a rule. SCPI command tables and vendor lookup
    # dicts read worse broken across lines than they do slightly over, so E501 is not enforced.
    "E501",
    # Semicolons are used deliberately in logic_decode.py to keep three parallel signal
    # arrays on one line, which is the point of that code.
    "E702",
    # `l` is a perfectly good name for an inductance.
    "E741",
    # zip() without strict= is fine where both sides are known to be the same length.
    "B905",
    # StrEnum would change what the wire format serialises to.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["ece_suite"]
